<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Simple jQuery</title>
<script src="scripts/jquery-1.11.3.min.js"></script>
<link  rel="stylesheet" href="scripts/qunit-2.0.1.css">


<script>
	$(document).ready(function() {
		$("#enter_item").click(function() {
			console.log("Message");
			$("#displayText").css({
				"color" : "purple"
			});
			$("#displayText").html("Changed");

			var x = $("#my_list");

			x.append("<li id='list_entry'>" + $("#nameInput").val() + "</li>")
		});
		$("#remove_item").click(function() {
			console.log("Message");
			$("#displayText").css({
				"color" : "purple"
			});
			$("#displayText").html("Changed");
			
			var x = $("#my_list");
			
			x.remove($("#nameInput").val());
			updateList();
		});
	});
</script>
</head>
<body>
<div id="qunit"></div >
<div id="qunit-fixture"></div >
<script  src="scripts/code.js"></script >
<script  src="scripts/qunit-1.20.0. js"></script >

	<p id="displayText">Waiting for you...</p>

	<ul id="my_list">
	</ul>
	

</body>
<script>
function updateList() {
	$.get("EndpointServlet", function(d) {
		console.log(d);
		
		var items = $.parseJSON(d);
		
		$("#my_list").empty();
		
		var x = $("#my_list");
		
		for (i = 0; i < items.length; i++) {
			console.log(items[i]);
			
			x.append("<li id='list_entry'>" + items[i] + "</li>");
		}
	});
}
</script>
